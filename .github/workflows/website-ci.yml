name: website-ci

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types:
      - product-update
      - product-release
      - steel-shapes-update
      - steel-shapes-release
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Publish to production Pages after all release checks; false runs validation/build only.'
        type: boolean
        default: false

concurrency:
  group: website-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && 'production' || 'validation' }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate index.html basics
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              "index.html": [
                  "<!DOCTYPE html>",
                  "<title>",
                  'meta name="description"',
                  "support@bluecollar-systems.com",
              ],
              "feedback.html": [
                  "<!DOCTYPE html>",
                  "<title>",
                  'meta name="description"',
                  "support@bluecollar-systems.com",
              ],
              "report-doctor.html": [
                  "<!DOCTYPE html>",
                  "<title>",
                  'meta name="description"',
                  "Import Report Doctor",
                  "report-doctor.js",
                  "support@bluecollar-systems.com",
              ],
          }

          for page, tokens in pages.items():
              path = Path(page)
              if not path.exists():
                  raise SystemExit(f"{page} not found")
              text = path.read_text(encoding="utf-8")
              missing = [t for t in tokens if t not in text]
              if missing:
                  raise SystemExit(f"{page} missing required tokens: {missing}")

          print("Static HTML checks passed.")
          PY

      - name: Validate sitemap completeness
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          sitemap = Path("sitemap.xml")
          if not sitemap.exists():
              raise SystemExit("sitemap.xml not found")

          tree = ET.parse(sitemap)
          root = tree.getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          listed_paths = set()
          for loc in root.findall("sm:url/sm:loc", ns):
              value = (loc.text or "").strip()
              if not value:
                  continue
              parsed = urlparse(value)
              path = parsed.path or "/"
              if path.endswith("/") and path != "/":
                  path = path[:-1]
              listed_paths.add(path)

          html_files = sorted(
              p for p in Path(".").glob("*.html") if p.name.lower() != "404.html"
          )
          missing = []
          for html in html_files:
              route = "/" if html.name == "index.html" else f"/{html.stem}"
              if route not in listed_paths:
                  missing.append(f"{html.name} -> {route}")

          if missing:
              raise SystemExit(
                  "sitemap.xml is missing page entries:\n" + "\n".join(missing)
              )

          print("Sitemap completeness check passed.")
          PY

      - name: Validate dynamic release link policy
        run: |
          python - <<'PY'
          from pathlib import Path

          checked_files = ["index.html", "shapes.html"]
          banned = "/releases/download/v"
          violations = []
          for name in checked_files:
              text = Path(name).read_text(encoding="utf-8")
              if banned in text:
                  violations.append(name)

          if violations:
              raise SystemExit(
                  "Found hardcoded versioned GitHub release links in: "
                  + ", ".join(violations)
              )

          print("Dynamic release link policy check passed.")
          PY

      # Every class used by the pages must have a rule in styles.css (there is
      # no Tailwind build), and no page may carry an inline <style> that the
      # site CSP blocks.
      - name: CSS class coverage
        run: node tests/css_class_coverage_test.js

      - name: Reject private PDF/CAD artifacts
        run: python tools/validate_private_artifacts.py

      - name: Private artifact guard regression
        run: python tests/test_validate_private_artifacts.py -v

      - name: Local preview route regression
        run: python tests/test_preview_site.py -v

      # R21 corrective §6: syntax-check every shipped script and prove a
      # hostile parts_bootstrap sidecar renders as literal text in Report
      # Doctor (no element/event-attribute injection, no innerHTML).
      - name: JavaScript syntax + Report Doctor XSS regression
        run: |
          node --check nav.js
          node --check support-links.js
          node tests/support_links_test.js
          node tests/nav_browser_test.js
          node tests/download_info_browser_test.js
          node --check part-resolver.js
          node tests/part_resolver_test.js
          node tests/part_page_browser_test.js
          node --check report-doctor.js
          node tests/report_doctor_file_inputs_test.js
          node tests/report_doctor_controls_test.js
          node tests/report_doctor_browser_test.js
          node tests/report_doctor_librecad_advice_test.js
          node tests/report_doctor_xss_test.js
          node tests/site_copy_contract_test.js
          node tests/privacy_policy_contract_test.js
          node tests/meta_copy_test.js

      - name: Release metadata digest regression
        run: python tests/test_sync_repo_metadata.py -v

      - name: Manual publication workflow contract
        run: python tests/test_manual_publication_workflow.py -v

      - name: Source-pinned release snapshot regression
        run: python tests/test_release_snapshot.py -v

      - name: Public deployment metadata regression
        run: python tests/test_verify_deployed_metadata.py -v

      - name: Public link check regression
        run: python tests/test_check_public_links.py -v

      - name: Build repository metadata snapshot
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_TOKEN || secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/sync_repo_metadata.py

      # Every link and download button, checked the way a stranger sees it:
      # no token, no login. A dead link (404/410) or a download that needs a
      # login fails here, so a download in a private repo blocks the deploy.
      # A busy site (5xx, 429, network error) is asked again over about a
      # minute and then only warned about, so brief github.com throttling
      # cannot hold back a release deploy.
      - name: Check links the way a visitor sees them
        run: python tools/check_public_links.py

      - name: Validate static metadata fallbacks
        run: python tools/validate_static_metadata.py

      # Cloudflare Pages publishes every file in the folder it is given and
      # ignores .cfignore. Build the allowlisted public folder here too, so a
      # pull request that adds a page or asset outside the list fails before
      # it can 404 in production.
      - name: Build site folder
        run: |
          python tools/build_site.py
          python tests/test_build_site.py -v

  deploy-pages:
    needs: static-checks
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build repository metadata snapshot
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_TOKEN || secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/sync_repo_metadata.py

      # Re-run the release gate against the deploy job's fresh API snapshot.
      # This closes the gap where a new mutable release could appear after
      # static-checks completed but before Cloudflare publication.
      - name: Validate final immutable release metadata
        run: python tools/validate_static_metadata.py

      # Copy only the public site files (pages, styles, scripts, images,
      # metadata, _headers, _redirects, .well-known/, p/, p-records/) into
      # _site/. Runs after the metadata sync so the stamped HTML and the
      # verified repo-metadata.json are the files that get published.
      - name: Build site folder
        run: python tools/build_site.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not account_id:
              print("::error::CLOUDFLARE_ACCOUNT_ID is missing.")
              raise SystemExit(1)
          if not token:
              print("::error::No Cloudflare API token secret found. Configure CLOUDFLARE_PAGES_API_TOKEN, CLOUDFLARE_API_TOKEN, or CF_API_TOKEN.")
              raise SystemExit(1)

          url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/bluecollar-website"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "bluecollar-website-ci/1.0",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print("::error::Cloudflare auth precheck failed. Update the deploy token with at least Account > Cloudflare Pages:Edit and Account Settings:Read permissions for this account.")
              print(body)
              raise SystemExit(1)

          if not data.get("success"):
              print("::error::Cloudflare auth precheck returned an unsuccessful response. Update token permissions (Account > Cloudflare Pages:Edit and Account Settings:Read).")
              print(json.dumps(data))
              raise SystemExit(1)

          print("Cloudflare deploy credentials validated.")
          PY
          npx --yes wrangler@4.83.0 pages deploy _site --project-name bluecollar-website --branch main

      # A successful upload does not prove that the custom domain serves the
      # new download links. Retry bounded propagation delays, then fail closed.
      # The same step proves repository-only files (README, workflows) 404.
      - name: Verify public download metadata
        run: python tools/verify_deployed_metadata.py

      # Same visitor's-eye check, now against the live site: every page and
      # on-site link. Outside links and download buttons were checked in
      # static-checks a few minutes earlier and are not requested again.
      - name: Check live links the way a visitor sees them
        run: python tools/check_public_links.py --base https://bluecollar-systems.com

      # Persist only the snapshot verified on the public domain. Failed auth,
      # failed deployments and stale public metadata must not stamp main.
      # GITHUB_TOKEN pushes do not retrigger workflows or mint new releases.
      - name: Commit stamped version badges back to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.html repo-metadata.json
          if git diff --cached --quiet; then
            echo "Repo badges already current."
          else
            git commit -m "chore: stamp release badges from metadata sync [skip release]"
            git push origin "HEAD:main" || echo "::warning::Badge stamp push failed (non-fatal; live deploy was verified)."
          fi
