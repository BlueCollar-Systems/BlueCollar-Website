name: auto-release

on:
  push:
    branches:
      - main
      - master
    # Docs/CI-only pushes should not mint a public release (board Q-08-a /
    # ANS-09-1). Shipped content is validated on push; publication is manual.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "_archived/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the reviewed, committed VERSION from main; false builds only.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build-only:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and build allowlisted site without version changes
        run: |
          python -I -B tools/validate_private_artifacts.py
          python -I -B tools/validate_static_metadata.py
          python -I -B tools/build_site.py
          python -I -B tests/test_build_site.py -v
          python -I -B tests/test_release_snapshot.py -v
          python -I -B tools/release_snapshot.py prepare --version "$(cat VERSION)" --repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/website-build-only"
      - name: Upload source and public-site build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: website-build-only-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/website-build-only/
            _site/

  release:
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # VERSION and the footer are prepared through a reviewed PR. Publication
      # never creates or pushes a source commit and never consumes another version.
      - name: Read prepared version
        id: version
        run: |
          python -I -B - <<'PY'
          import os
          import pathlib
          import re

          version_file = pathlib.Path("VERSION")
          version = version_file.read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid VERSION format: {version!r}")
          index_text = pathlib.Path("index.html").read_text(encoding="utf-8")
          footers = re.findall(r'footer-version">v(\d+\.\d+\.\d+)', index_text)
          if footers != [version]:
              raise SystemExit(f"Prepare matching VERSION and one footer in a reviewed PR: {footers!r}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Build source-pinned release archive and provenance
        run: |
          python -I -B tests/test_release_snapshot.py -v
          python -I -B tools/release_snapshot.py prepare --version "${{ steps.version.outputs.version }}" --repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/website-release"

      - name: Verify source and uploaded draft bytes before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -I -B tools/release_snapshot.py publish --provenance "$RUNNER_TEMP/website-release/BlueCollar-Website_v${{ steps.version.outputs.version }}.provenance.json"
