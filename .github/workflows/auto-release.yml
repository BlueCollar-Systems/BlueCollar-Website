name: auto-release

on:
  push:
    branches:
      - main
      - master
    # Docs/CI-only pushes should not mint a public release (board Q-08-a /
    # ANS-09-1). Shipped content (*.html, assets) still releases normally.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "_archived/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read and bump version
        id: version
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          version_file = pathlib.Path("VERSION")
          current = version_file.read_text(encoding="utf-8").strip() if version_file.exists() else "0.0.0"
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", current)
          if not m:
              raise SystemExit(f"Invalid VERSION format: {current!r}")

          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          version_file.write_text(new_version + "\n", encoding="utf-8")

          index = pathlib.Path("index.html")
          if index.exists():
              index_text = index.read_text(encoding="utf-8")
              index_text = re.sub(
                  r'(footer-version">v)(\d+\.\d+\.\d+)',
                  rf"\g<1>{new_version}",
                  index_text,
                  count=1,
              )
              index_text = re.sub(
                  r"(&middot;\s*Updated\s+)[A-Za-z]+ \d{4}",
                  rf"\g<1>{datetime.date.today().strftime('%B %Y')}",
                  index_text,
                  count=1,
              )
              index.write_text(index_text, encoding="utf-8")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"old_version={current}\nversion={new_version}\n", encoding="utf-8")
          PY

      - name: Sync product repo badges into HTML fallbacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_repo_metadata.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION index.html shapes.html repo-metadata.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Build release archive
        run: |
          set -e
          ZIP="BlueCollar-Website_v${{ steps.version.outputs.version }}.zip"
          git archive --format=zip --output "$ZIP" HEAD
          ls -lh "$ZIP"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ZIP="BlueCollar-Website_v${{ steps.version.outputs.version }}.zip"
          TITLE="$TAG — BlueCollar Website Snapshot"
          NOTES="Automated release snapshot from latest \`main\` commit.

          This release includes the static site source used for deployment."

          # RB-21 / Round 21 corrective: existing releases are immutable. Site
          # snapshots are versioned per release — never re-upload/clobber assets
          # under an existing tag; the next push mints the next snapshot version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — immutable; skipping asset upload."
            echo "::warning::Release ${TAG} already exists; its assets are immutable. Snapshot NOT uploaded — the next push mints the next snapshot version."
            exit 0
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest "$ZIP"
          fi
