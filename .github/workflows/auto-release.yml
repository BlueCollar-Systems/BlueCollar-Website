name: auto-release

on:
  push:
    branches:
      - main
      - master
    # Docs/CI-only pushes should not mint a public release (board Q-08-a /
    # ANS-09-1). Shipped content is validated on push; publication is manual.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "_archived/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish validated assets after all current work and native checks are complete; false builds only.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build-only:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and build allowlisted site without version changes
        run: |
          python tools/validate_private_artifacts.py
          python tools/validate_static_metadata.py
          python tools/build_site.py
          python tests/test_build_site.py -v
          python tests/test_release_snapshot.py -v
          python tools/release_snapshot.py prepare --version "$(cat VERSION)" --repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/website-build-only"
      - name: Upload source and public-site build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: website-build-only-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/website-build-only/
            _site/

  release:
    if: "github.event_name == 'workflow_dispatch' && inputs.publish_release == true && !startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read and bump version
        id: version
        run: |
          python - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          version_file = pathlib.Path("VERSION")
          current = version_file.read_text(encoding="utf-8").strip() if version_file.exists() else "0.0.0"
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", current)
          if not m:
              raise SystemExit(f"Invalid VERSION format: {current!r}")

          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          version_file.write_text(new_version + "\n", encoding="utf-8")

          index = pathlib.Path("index.html")
          if index.exists():
              index_text = index.read_text(encoding="utf-8")
              index_text = re.sub(
                  r'(footer-version">v)(\d+\.\d+\.\d+)',
                  rf"\g<1>{new_version}",
                  index_text,
                  count=1,
              )
              index_text = re.sub(
                  r"(&middot;\s*Updated\s+)[A-Za-z]+ \d{4}",
                  rf"\g<1>{datetime.date.today().strftime('%B %Y')}",
                  index_text,
                  count=1,
              )
              index.write_text(index_text, encoding="utf-8")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"old_version={current}\nversion={new_version}\n", encoding="utf-8")
          PY

      - name: Sync product repo badges into HTML fallbacks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_repo_metadata.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION index.html shapes.html repo-metadata.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Build source-pinned release archive and provenance
        run: |
          python tests/test_release_snapshot.py -v
          python tools/release_snapshot.py prepare --version "${{ steps.version.outputs.version }}" --repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/website-release"

      - name: Verify source and uploaded draft bytes before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/release_snapshot.py publish --provenance "$RUNNER_TEMP/website-release/BlueCollar-Website_v${{ steps.version.outputs.version }}.provenance.json"
