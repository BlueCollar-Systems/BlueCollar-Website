name: security-remediation

on:
  workflow_dispatch:
    inputs:
      dmarc_policy:
        description: "DMARC policy to apply"
        required: true
        default: "quarantine"
        type: choice
        options:
          - none
          - quarantine
          - reject
      dmarc_pct:
        description: "DMARC pct value (0-100)"
        required: true
        default: "25"
        type: string
      enable_turnstile:
        description: "Attempt Turnstile widget auto-provision"
        required: true
        default: true
        type: boolean
      enable_security_txt:
        description: "Enable Cloudflare-managed security.txt"
        required: true
        default: true
        type: boolean
      enable_hsts:
        description: "Enable HSTS (security_header) zone setting"
        required: true
        default: true
        type: boolean
      enable_min_tls:
        description: "Set minimum TLS version to 1.2"
        required: true
        default: true
        type: boolean
      enable_always_use_https:
        description: "Enable Always Use HTTPS"
        required: true
        default: true
        type: boolean
      enable_www_cname:
        description: "Ensure www CNAME to Pages hostname"
        required: true
        default: true
        type: boolean
      enable_pages_www_domain:
        description: "Register www as Pages custom domain"
        required: true
        default: true
        type: boolean
      hsts_via_pages_headers:
        description: "Disable zone HSTS so Pages _headers applies on custom domains"
        required: true
        default: true
        type: boolean
      enable_hsts_response_rule:
        description: "Set HSTS via response header transform rule"
        required: true
        default: true
        type: boolean

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Cloudflare security remediations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: "0878e2d033aacb574465c1c3aa6cfa88"
          TARGET_DOMAIN: bluecollar-systems.com
          PAGES_PROJECT: bluecollar-website
          WWW_CNAME_TARGET: bluecollar-website.pages.dev
          DMARC_POLICY: ${{ github.event.inputs.dmarc_policy }}
          DMARC_PCT: ${{ github.event.inputs.dmarc_pct }}
          ENABLE_TURNSTILE: ${{ github.event.inputs.enable_turnstile }}
          ENABLE_SECURITY_TXT: ${{ github.event.inputs.enable_security_txt }}
          ENABLE_HSTS: ${{ github.event.inputs.enable_hsts }}
          ENABLE_MIN_TLS: ${{ github.event.inputs.enable_min_tls }}
          ENABLE_ALWAYS_USE_HTTPS: ${{ github.event.inputs.enable_always_use_https }}
          ENABLE_WWW_CNAME: ${{ github.event.inputs.enable_www_cname }}
          ENABLE_PAGES_WWW_DOMAIN: ${{ github.event.inputs.enable_pages_www_domain }}
          HSTS_VIA_PAGES_HEADERS: ${{ github.event.inputs.hsts_via_pages_headers }}
          ENABLE_HSTS_RESPONSE_RULE: ${{ github.event.inputs.enable_hsts_response_rule }}
          DMARC_STRICT: "true"
        run: |
          python tools/remediate_cloudflare_security.py
